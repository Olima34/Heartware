name: Release

# Every green push on main is already published by the Build workflow (v0.3.1, v0.3.2…). Pushing a tag by hand
# changes the numbering: `git tag v0.4.0 && git push origin main v0.4.0` publishes 0.4.0, and the next pushes give
# 0.4.1, 0.4.2… The README's download button and scripts/install.sh always fetch the latest version.
on:
  push:
    tags: ['v*']

# Read only by default: only the job that publishes writes the release (through gh and its token, never git push).
# Actions are pinned to a commit (the version in the comment): a moved tag cannot change what runs here.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the universal app
        run: HW_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build_app.sh --no-install --zip --universal
      - name: Upload the app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Heartware
          path: build/Heartware.zip

  # The app signed with the release certificate (codesign needs macOS), then handed to publish, which signs the
  # archive on Linux (its openssl knows Ed25519). Like publish, it compiles and runs nothing from the repository.
  sign:
    needs: build
    runs-on: macos-15
    # The signing certificate, like in build.yml.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the previous version, whose certificate the installed copies have
          persist-credentials: false
      - name: Download the app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Heartware
          path: build
      # The same step as in build.yml.
      # One certificate signs every version: macOS ties the permissions (Full Disk Access, Accessibility…) and the app's
      # keychain items to it, so an update keeps them. Self-signed, made once by scripts/setup_release_signing.sh, its key
      # only in the secret CMC_CODESIGN_IDENTITY. Before the archive is signed, which covers the app signed here.
      - name: Sign the app
        env:
          CMC_CODESIGN_IDENTITY: ${{ secrets.CMC_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          ZIP="$PWD/build/Heartware.zip"
          SOURCE=Sources/Heartware/Features/Updates/UpdatesSelfSigning.swift
          cert_in() { sed -nE 's/^ *static let releaseCertificate: String\? = "([0-9A-F]{40})".*/\1/p'; }
          # The certificate (SHA-1) the installed copies are signed with: that of the previous version.
          PREVIOUS="$(git tag --merged HEAD --no-contains HEAD --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p || true)"
          TRUSTED="$([[ -n "$PREVIOUS" ]] && git show "$PREVIOUS:$SOURCE" 2>/dev/null | cert_in || true)"
          # The one this version is signed with.
          NEXT="$(cert_in < "$SOURCE")"
          if [[ -z "$NEXT" ]]; then
            if [[ -n "$TRUSTED" ]]; then
              echo "::error::Plus de certificat de publication dans $SOURCE : les copies installées perdraient leurs autorisations."
              exit 1
            fi
            echo "::warning::Pas encore de certificat de publication : version signée ad hoc, macOS redemandera les autorisations après la mise à jour."
            exit 0
          fi
          if [[ -z "$CMC_CODESIGN_IDENTITY" ]]; then
            echo "::error::Secret CMC_CODESIGN_IDENTITY absent : lance ./scripts/setup_release_signing.sh. Rien n'est publié."
            exit 1
          fi
          WORK="$RUNNER_TEMP/codesign"
          KEYCHAIN="$WORK/release.keychain-db"
          mkdir -p "$WORK"
          trap 'security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -rf "$WORK"' EXIT
          (umask 077 && printf '%s\n' "$CMC_CODESIGN_IDENTITY" > "$WORK/identity.pem")
          HASH="$(/usr/bin/openssl x509 -in "$WORK/identity.pem" -noout -fingerprint -sha1 | sed -e 's/.*=//' -e 's/://g' | tr a-f A-F)"
          if [[ "$HASH" != "$NEXT" ]]; then
            echo "::error::CMC_CODESIGN_IDENTITY n'est pas le certificat nommé dans $SOURCE ($NEXT) : rien n'est publié."
            exit 1
          fi
          if [[ -n "$TRUSTED" && "$TRUSTED" != "$NEXT" ]]; then
            echo "::warning::Cette version change de certificat ($TRUSTED → $NEXT) : macOS redemandera une fois les autorisations."
          fi
          # A keychain of this job's own, deleted at the end, where codesign reaches the key without any window.
          PASS="$(/usr/bin/openssl rand -hex 24)"
          (umask 077 && /usr/bin/openssl pkcs12 -export -in "$WORK/identity.pem" -inkey "$WORK/identity.pem" -name "Clean My Claude" \
             -passout "pass:$PASS" -out "$WORK/identity.p12")
          rm -f "$WORK/identity.pem"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$WORK/identity.p12" -k "$KEYCHAIN" -P "$PASS" -f pkcs12 -x -T /usr/bin/codesign >/dev/null
          rm -f "$WORK/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          # On the runner, codesign only finds an identity in a keychain of the search list, even with --keychain:
          # this one goes first (deleting it at the end takes it out again).
          KEYCHAINS=()
          while IFS= read -r line; do KEYCHAINS+=("$line"); done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN" ${KEYCHAINS[@]+"${KEYCHAINS[@]}"}
          security find-identity -p codesigning "$KEYCHAIN"
          # The hardened runtime and the entitlements given by build_app.sh are kept.
          ditto -x -k "$ZIP" "$WORK/app"
          APP="$WORK/app/Heartware.app"
          codesign --force --deep --preserve-metadata=entitlements,flags,runtime --keychain "$KEYCHAIN" --sign "$HASH" "$APP"
          codesign --verify --deep --strict "$APP"
          if ! codesign -d -r- "$APP" 2>&1 | grep -qi "certificate leaf = H\"$HASH\""; then
            echo "::error::L'app signée ne désigne pas le certificat $HASH : rien n'est publié."
            exit 1
          fi
          rm -f "$ZIP"
          (cd "$WORK/app" && ditto -c -k --keepParent "Heartware.app" "$ZIP")
          echo "App signée par le certificat $HASH"
      - name: Upload the signed app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Heartware-signed
          path: build/Heartware.zip

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    # The signing key, like in build.yml: this job compiles and runs nothing from the repository before signing.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the previous version, for the notes
          persist-credentials: false
      - name: Download the app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Heartware-signed
          path: build
      # The same step as in build.yml.
      - name: Sign the archive
        env:
          CMC_UPDATE_KEY: ${{ secrets.CMC_UPDATE_KEY }}
        run: |
          set -euo pipefail
          ZIP=build/Heartware.zip
          SOURCE=Sources/Heartware/Features/Updates/UpdatesSelf.swift
          key_in() { sed -nE 's/^ *static let publicKey: String\? = "([A-Za-z0-9+\/=]{44})".*/\1/p'; }
          # The public key (base64 of the raw 32 bytes) the installed copies check against: that of the previous version.
          PREVIOUS="$(git tag --merged HEAD --no-contains HEAD --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p || true)"
          TRUSTED="$([[ -n "$PREVIOUS" ]] && git show "$PREVIOUS:$SOURCE" 2>/dev/null | key_in || true)"
          # The one this version will check the next ones against (a new one when the key changes).
          NEXT="$(key_in < "$SOURCE")"
          if [[ -z "$CMC_UPDATE_KEY" ]]; then
            if [[ -n "$TRUSTED$NEXT" ]]; then
              echo "::error::Secret CMC_UPDATE_KEY absent : les copies installées refuseraient une version sans signature."
              exit 1
            fi
            echo "::warning::Secret CMC_UPDATE_KEY absent : version publiée sans signature."
            exit 0
          fi
          KEY="$RUNNER_TEMP/update_key.pem"
          trap 'rm -f "$KEY"' EXIT
          (umask 077 && printf '%s\n' "$CMC_UPDATE_KEY" > "$KEY")
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$ZIP" -out "$RUNNER_TEMP/zip.sig"
          openssl pkey -in "$KEY" -pubout -out "$RUNNER_TEMP/update_key.pub"
          rm -f "$KEY"
          PUBLIC="$(openssl pkey -pubin -in "$RUNNER_TEMP/update_key.pub" -outform DER | tail -c 32 | openssl base64 -A)"
          if [[ -n "$TRUSTED" && "$PUBLIC" != "$TRUSTED" ]]; then
            echo "::error::CMC_UPDATE_KEY n'est pas la clé que vérifient les copies installées ($PREVIOUS : $TRUSTED) : rien n'est publié."
            exit 1
          fi
          if [[ -n "$NEXT" && "$PUBLIC" != "$NEXT" ]]; then
            echo "::warning::Cette version passe à la clé $NEXT : remplace le secret CMC_UPDATE_KEY avant de publier la suivante."
          fi
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update_key.pub" -rawin -in "$ZIP" -sigfile "$RUNNER_TEMP/zip.sig"
          { openssl base64 -A -in "$RUNNER_TEMP/zip.sig" && echo; } > "$ZIP.sig"
          echo "Signée par la clé $PUBLIC"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish_release.sh "${GITHUB_REF_NAME#v}" build/Heartware.zip
